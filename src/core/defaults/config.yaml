core:
  log:
    dir: "@jinja {{env.CORE_LOG_DIR or '/data/logs'}}"
  storage:
    file:
      dir: "@jinja {{env.CORE_STORAGE_FILE_DIR or '/data/storage'}}"
  version_check_url: "@jinja {{env.VERSION_CHECK_URL or ''}}"

models:
  large: "@jinja {{env.LLM_MODEL_LARGE or 'openai:gpt-4.1'}}"
  small: "@jinja {{env.LLM_MODEL_SMALL or 'openai:gpt-4.1-mini'}}"

providers:
  devops:
    url: "@jinja {{ env.get('AZURE_URL', '') }}"
    organization: "@jinja {{ env.get('AZURE_DEVOPS_ORGANIZATION', '') }}"
    project: "@jinja {{ env.get('AZURE_DEVOPS_PROJECT', '') }}"
    pat: "@jinja {{ env.get('AZURE_DEVOPS_PAT', '') }}"
    repoId: "@jinja {{ env.get('AZURE_DEVOPS_REPOID', '') }}"
    mock: "@jinja {{ env.get('AZURE_DEVOPS_MOCK', 'False') }}"
    # Development only: permit an http:// url for cloning. Clone URLs must
    # otherwise use https and always match the host of url.
    allowInsecureCloneUrl: "@jinja {{ env.get('DEVOPS_ALLOW_INSECURE_CLONE_URL', 'False') }}"
  gitlab:
    api_url: "@jinja {{ env.get('GITLAB_API_URL', '') }}"
    project_id: "@jinja {{ env.get('GITLAB_PROJECT_ID', '') }}"
    token: "@jinja {{ env.get('GITLAB_TOKEN', '') }}"
    mock: "@jinja {{ env.get('GITLAB_MOCK', 'False') }}"
    # Development only: permit http:// clone URLs returned by the API. Clone
    # URLs must otherwise use https and always match the host of api_url.
    allowInsecureCloneUrl: "@jinja {{ env.get('GITLAB_ALLOW_INSECURE_CLONE_URL', 'False') }}"
  github:
    api_url: "@jinja {{ env.get('GITHUB_API_URL', '') }}"
    owner: "@jinja {{ env.get('GITHUB_OWNER', '') }}"
    repo: "@jinja {{ env.get('GITHUB_REPO', '') }}"
    token: "@jinja {{ env.get('GITHUB_TOKEN', '') }}"
    mock: "@jinja {{ env.get('GITHUB_MOCK', 'False') }}"
    # Development only: permit http:// clone URLs. Clone URLs must otherwise
    # use https and always match the web host derived from api_url.
    allowInsecureCloneUrl: "@jinja {{ env.get('GITHUB_ALLOW_INSECURE_CLONE_URL', 'False') }}"
  jira:
    domain: "@jinja {{ env.get('JIRA_DOMAIN', '') }}"
    email: "@jinja {{ env.get('JIRA_EMAIL', '') }}"
    token: "@jinja {{ env.get('JIRA_TOKEN', '') }}"
    mock: "@jinja {{ env.get('JIRA_MOCK', 'False') }}"
    imageModel: "@jinja {{ env.get('JIRA_IMAGE_MODEL', '') }}"
  bitbucket:
    api_url: "@jinja {{ env.get('BITBUCKET_API_URL', 'https://api.bitbucket.org/2.0') }}"
    workspace: "@jinja {{ env.get('BITBUCKET_WORKSPACE', '') }}"
    repo_slug: "@jinja {{ env.get('BITBUCKET_REPO_SLUG', '') }}"
    username: "@jinja {{ env.get('BITBUCKET_EMAIL', '') }}"
    token: "@jinja {{ env.get('BITBUCKET_TOKEN', '') }}"
    mock: "@jinja {{ env.get('BITBUCKET_MOCK', 'False') }}"
    # Development only: permit http:// clone URLs. Clone URLs must otherwise
    # use https and always match the web host derived from api_url.
    allowInsecureCloneUrl: "@jinja {{ env.get('BITBUCKET_ALLOW_INSECURE_CLONE_URL', 'False') }}"

projects:
  default:
    git:
      path: "@jinja {{env.GIT_REPO_PATH or '/code'}}"
      defaultBranch: "main"
      autoPull: "@jinja {{env.GIT_AUTOPULL or 'false'}}"
      pullIntervalSeconds: "@jinja {{env.GIT_PULL_INTERVAL_SECONDS or 120}}"
    pullrequests:
      devops:
        url: "@jinja {{ this.providers.devops.url }}"
        organization: "@jinja {{ this.providers.devops.organization }}"
        project: "@jinja {{ this.providers.devops.project }}"
        pat: "@jinja {{ this.providers.devops.pat }}"
        repoId: "@jinja {{ this.providers.devops.repoId }}"
        mock: "@jinja {{ this.providers.devops.mock }}"
        allowInsecureCloneUrl: "@jinja {{ this.providers.devops.allowInsecureCloneUrl }}"
      gitlab:
        api_url: "@jinja {{ this.providers.gitlab.api_url }}"
        project_id: "@jinja {{ this.providers.gitlab.project_id }}"
        token: "@jinja {{ this.providers.gitlab.token }}"
        mock: "@jinja {{ this.providers.gitlab.mock }}"
        allowInsecureCloneUrl: "@jinja {{ this.providers.gitlab.allowInsecureCloneUrl }}"
      github:
        api_url: "@jinja {{ this.providers.github.api_url }}"
        owner: "@jinja {{ this.providers.github.owner }}"
        repo: "@jinja {{ this.providers.github.repo }}"
        token: "@jinja {{ this.providers.github.token }}"
        mock: "@jinja {{ this.providers.github.mock }}"
        allowInsecureCloneUrl: "@jinja {{ this.providers.github.allowInsecureCloneUrl }}"
      bitbucket:
        api_url: "@jinja {{ this.providers.bitbucket.api_url }}"
        workspace: "@jinja {{ this.providers.bitbucket.workspace }}"
        repo_slug: "@jinja {{ this.providers.bitbucket.repo_slug }}"
        username: "@jinja {{ this.providers.bitbucket.username }}"
        token: "@jinja {{ this.providers.bitbucket.token }}"
        mock: "@jinja {{ this.providers.bitbucket.mock }}"
        allowInsecureCloneUrl: "@jinja {{ this.providers.bitbucket.allowInsecureCloneUrl }}"
    issues:
      devops:
        url: "@jinja {{ this.providers.devops.url }}"
        organization: "@jinja {{ this.providers.devops.organization }}"
        project: "@jinja {{ this.providers.devops.project }}"
        pat: "@jinja {{ this.providers.devops.pat }}"
        repoId: "@jinja {{ this.providers.devops.repoId }}"
        mock: "@jinja {{ this.providers.devops.mock }}"
      gitlab:
        api_url: "@jinja {{ this.providers.gitlab.api_url }}"
        project_id: "@jinja {{ this.providers.gitlab.project_id }}"
        token: "@jinja {{ this.providers.gitlab.token }}"
        mock: "@jinja {{ this.providers.gitlab.mock }}"
      github:
        api_url: "@jinja {{ this.providers.github.api_url }}"
        owner: "@jinja {{ this.providers.github.owner }}"
        repo: "@jinja {{ this.providers.github.repo }}"
        token: "@jinja {{ this.providers.github.token }}"
        mock: "@jinja {{ this.providers.github.mock }}"
      jira:
        domain: "@jinja {{ this.providers.jira.domain }}"
        email: "@jinja {{ this.providers.jira.email }}"
        token: "@jinja {{ this.providers.jira.token }}"
        mock: "@jinja {{ this.providers.jira.mock }}"
        imageModel: "@jinja {{ this.providers.jira.imageModel }}"
    pipelines:
      gitlab:
        api_url: "@jinja {{ this.providers.gitlab.api_url }}"
        project_id: "@jinja {{ this.providers.gitlab.project_id }}"
        token: "@jinja {{ this.providers.gitlab.token }}"
        mock: "@jinja {{ this.providers.gitlab.mock }}"

slack:
  bot:
    botToken:    "@jinja {{ env.SLACK_BOT_TOKEN or '' }}"
    appToken:    "@jinja {{ env.SLACK_APP_TOKEN or '' }}"
    processingTimeout: "@jinja {{ env.SLACK_PROCESSING_TIMEOUT or 6000 }}"
    alwaysRespond: "@jinja {{ env.ALWAYS_RESPOND or false }}"
  attachments:
    # Opt-in: forwarding private Slack files into the LLM context is a
    # deliberate deployment choice, so this defaults off.
    enabled: "@jinja {{ env.SLACK_ATTACHMENTS_ENABLED or false }}"
    maxFileSizeMb: "@jinja {{ env.SLACK_ATTACHMENT_MAX_SIZE_MB or 25 }}"
    maxInlineTextKb: "@jinja {{ env.SLACK_ATTACHMENT_MAX_INLINE_TEXT_KB or 50 }}"
  assistant:
    welcomeMessage: "Hi! Ask me anything about the codebase, pull requests, or work items."
    includeFeedbackButtons: "@jinja {{ env.SLACK_INCLUDE_FEEDBACK_BUTTONS or false }}"
    suggestedPrompts:
      - title: "Write testing notes"
        message: "Write testing notes for work item <id>"
      - title: "Analyze a pull request"
        message: "Analyze the changes in PR <id>"
      - title: "Explain code"
        message: "Explain how <area of the codebase> works"
      - title: "Debug help"
        message: "Help me investigate <bug or behaviour>"

http:
  server:
    host: "@jinja {{env.HTTP_HOST or '0.0.0.0'}}"
    port: "@jinja {{env.HTTP_PORT or 8000}}"
    corsOrigins: "@jinja {{env.HTTP_CORS_ORIGINS or ''}}"

agui:
  server:
    enabled: "@jinja {{env.AGUI_ENABLED or false}}"
    # Comma-separated Bearer tokens. This endpoint runs the agent, so when it
    # is enabled without keys startup fails unless allowUnauthenticated is set.
    apiKeys: "@jinja {{env.AGUI_API_KEYS or ''}}"
    # Explicit opt-in to run without authentication. Unsafe outside a trusted
    # network: anyone reaching the port gets repository access and LLM spend.
    allowUnauthenticated: "@jinja {{env.AGUI_ALLOW_UNAUTHENTICATED or false}}"
  agent:
    defaultTimeout: "@jinja {{env.AGUI_DEFAULT_TIMEOUT or 300}}"
    defaultAgentType: "@jinja {{env.AGUI_DEFAULT_AGENT_TYPE or 'gitchatbot'}}"
    maxMessageLength: "@jinja {{env.AGUI_MAX_MESSAGE_LENGTH or 10000}}"

openai:
  server:
    enabled: "@jinja {{env.OPENAI_ENTRYPOINT_ENABLED or false}}"
    # Comma-separated Bearer tokens; same fail-closed rule as agui.server.
    apiKeys: "@jinja {{env.OPENAI_API_KEYS or ''}}"
    # Explicit opt-in to run without authentication. Unsafe outside a trusted
    # network: anyone reaching the port gets repository access and LLM spend.
    allowUnauthenticated: "@jinja {{env.OPENAI_ALLOW_UNAUTHENTICATED or false}}"
    modelName: "@jinja {{env.OPENAI_MODEL_NAME or 'dev-agents'}}"
    streaming: "@jinja {{env.OPENAI_STREAMING_ENABLED or true}}"
    thinking: "@jinja {{env.OPENAI_THINKING_ENABLED or true}}"
  agent:
    defaultTimeout: "@jinja {{env.OPENAI_DEFAULT_TIMEOUT or 300}}"
    defaultAgentType: "@jinja {{env.OPENAI_DEFAULT_AGENT_TYPE or 'gitchatbot'}}"

nats:
  server_url: "@jinja {{ env.get('NATS_SERVER_URL', '') }}"
  job_id: "@jinja {{ env.get('NATS_JOB_ID', '') }}"
  user: "@jinja {{ env.get('NATS_USER', '') }}"
  password: "@jinja {{ env.get('NATS_PASSWORD', '') }}"
  ca_cert_path: "@jinja {{ env.get('NATS_CA_CERT_PATH', '') }}"
  subject_job_data: "@jinja {{ env.get('NATS_SUBJECT_JOB_DATA', 'jobs') }}"
  subject_job_updates: "@jinja {{ env.get('NATS_SUBJECT_JOB_UPDATES', 'jobupdates') }}"

cli:
  agent:
    defaultAgentType: "@jinja {{env.CLI_DEFAULT_AGENT_TYPE or 'gitchatbot'}}"

skills:
  enable: []
  search_paths: []  # Additional directories to search for skill modules

agents:
  gitchatbot:
    model: "@jinja {{ this.models.large }}"
    maxTokens: 2000
    temperature: 0.7
    timeoutSeconds: 60

subagents:
  coderesearch:
    model: "@jinja {{ this.models.small }}"
  claude_code:
    cli_path: "@jinja {{ env.get('CLAUDE_CODE_PATH', '') }}"
    model: "@jinja {{ env.get('CLAUDE_CODE_MODEL', 'claude-sonnet-5') }}"
